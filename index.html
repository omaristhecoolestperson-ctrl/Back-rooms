<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Backrooms</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #d4af37;
        }
        #start-screen h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #d4af37;
        }
        #start-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #d4af37;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.2s;
        }
        #start-btn:hover {
            background-color: #fff;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

    <!-- Click to Start Overlay -->
    <div id="start-screen">
        <h1>THE BACKROOMS</h1>
        <button id="start-btn">CLICK TO START</button>
    </div>

    <div id="instructions">Use WASD to move, Mouse to look around. Don't hit the walls.</div>

    <!-- Include Three.js and PointerLockControls from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        const walls = []; // Store wall bounding boxes for collision

        init();
        animate();

        function init() {
            // 1. Scene setup with yellow backrooms aesthetic & fog
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd4af37);
            scene.fog = new THREE.FogExp2(0xd4af37, 0.035);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); // Eye level height

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. Pointer Lock Controls for Mouse Look
            controls = new THREE.PointerLockControls(camera, document.body);

            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');

            startBtn.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                startScreen.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                startScreen.style.display = 'flex';
            });

            scene.add(controls.getObject());

            // 5. Lighting (Dim fluorescent style)
            const ambientLight = new THREE.AmbientLight(0xfffaed, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffe87c, 1, 20);
            pointLight.position.set(0, 3, 0);
            scene.add(pointLight);

            // 6. Materials
            const wallMaterial = new THREE.MeshBasicMaterial({ color: 0xc29b38 });
            const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x8c7323 });
            const ceilingMaterial = new THREE.MeshBasicMaterial({ color: 0x3b351a });

            // 7. Build Environment (Floor & Ceiling)
            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const ceilingGeometry = new THREE.PlaneGeometry(50, 50);
            const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 4;
            scene.add(ceiling);

            // 8. Build Maze Walls with Collisions
            // Helper function to create walls
            function createWall(x, z, width, depth) {
                const wallGeo = new THREE.BoxGeometry(width, 4, depth);
                const wallMesh = new THREE.Mesh(wallGeo, wallMaterial);
                wallMesh.position.set(x, 2, z);
                scene.add(wallMesh);

                // Create and store bounding box for collision detection
                const box = new THREE.Box3().setFromObject(wallMesh);
                walls.push(box);
            }

            // Outer boundaries
            createWall(0, -25, 50, 1);
            createWall(0, 25, 50, 1);
            createWall(-25, 0, 1, 50);
            createWall(25, 0, 1, 50);

            // Internal Backrooms maze walls
            createWall(-10, -10, 15, 1);
            createWall(10, -5, 1, 15);
            createWall(-5, 10, 15, 1);
            createWall(5, 10, 1, 10);

            // 9. Keyboard Event Listeners
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            window.addEventListener('resize', onWindowResize);
        }

        function windowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Simple Collision Check against player position
        function checkCollision(position) {
            const playerRadius = 0.4;
            // Create a bounding box representing the player's space
            const playerBox = new THREE.Box3(
                new THREE.Vector3(position.x - playerRadius, position.y - 1.5, position.z - playerRadius),
                new THREE.Vector3(position.x + playerRadius, position.y + 0.5, position.z + playerRadius)
            );

            for (let i = 0; i < walls.length; i++) {
                if (playerBox.intersectsBox(walls[i])) {
                    return true; // Collision!
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Consistent movement speed in all directions

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                // Predict Next Position X
                const oldPosition = controls.getObject().position.clone();
                controls.moveRight(-velocity.x * delta);
                if (checkCollision(controls.getObject().position)) {
                    controls.getObject().position.x = oldPosition.x; // Revert X if collision
                }

                // Predict Next Position Z
                controls.moveForward(-velocity.z * delta);
                if (checkCollision(controls.getObject().position)) {
                    controls.getObject().position.z = oldPosition.z; // Revert Z if collision
                }

                prevTime = time;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
