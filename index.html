<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Backrooms Hub</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #d4af37;
        }
        #start-screen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #d4af37;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }
        select, #start-btn {
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid #d4af37;
        }
        select {
            background-color: #1a1a1a;
            color: #d4af37;
        }
        #start-btn {
            background-color: #d4af37;
            color: #000;
            font-weight: bold;
            transition: 0.2s;
        }
        #start-btn:hover {
            background-color: #fff;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

    <!-- Start Screen & Level Selector -->
    <div id="start-screen">
        <h1>THE BACKROOMS</h1>
        <div class="menu-container">
            <label for="level-select">Select Level:</label>
            <select id="level-select">
                <option value="0">Level 0: The Lobby (Classic Yellow)</option>
                <option value="1">Level 1: Habitable Zone (Concrete)</option>
            </select>
            <button id="start-btn">CLICK TO START</button>
        </div>
    </div>

    <div id="instructions">WASD to move, Mouse to look. Press ESC if your mouse gets stuck.</div>

    <!-- Include Three.js and PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const walls = [];
        let currentLevel = "0";

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');
            const levelSelect = document.getElementById('level-select');

            // Build initial default level layout right away on load
            buildLevel(currentLevel);

            // Instant lock on click to bypass security block
            startBtn.addEventListener('click', () => {
                currentLevel = levelSelect.value;
                buildLevel(currentLevel);
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                startScreen.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                startScreen.style.display = 'flex';
            });

            scene.add(controls.getObject());

            // Keyboard Listeners
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyD') moveRight = true;
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyD') moveRight = false;
            });

            window.addEventListener('resize', onWindowResize);
        }

        function buildLevel(levelId) {
            walls.length = 0;
            
            // Clear old meshes from scene
            scene.children.forEach(child => {
                if (child !== camera && child !== controls.getObject() && child.type !== 'AmbientLight' && child.type !== 'PointLight') {
                    scene.remove(child);
                }
            });

            if (levelId === "0") {
                scene.background = new THREE.Color(0xd4af37);
                scene.fog = new THREE.FogExp2(0xd4af37, 0.035);
                createEnvironment(
                    new THREE.MeshBasicMaterial({ color: 0xc29b38 }),
                    new THREE.MeshBasicMaterial({ color: 0x8c7323 }),
                    new THREE.MeshBasicMaterial({ color: 0x3b351a })
                );
            } else if (levelId === "1") {
                scene.background = new THREE.Color(0x3a3a3a);
                scene.fog = new THREE.FogExp2(0x3a3a3a, 0.04);
                createEnvironment(
                    new THREE.MeshBasicMaterial({ color: 0x505050 }),
                    new THREE.MeshBasicMaterial({ color: 0x242424 }),
                    new THREE.MeshBasicMaterial({ color: 0x111111 })
                );

                // Add entity box in Level 1
                const entityMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 2, 0.5),
                    new THREE.MeshBasicMaterial({ color: 0xff0000 })
                );
                entityMesh.position.set(0, 1, -12);
                scene.add(entityMesh);
            }
        }

        function createEnvironment(wallMat, floorMat, ceilMat) {
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), ceilMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 4;
            scene.add(ceiling);

            function addWall(x, z, w, d) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 4, d), wallMat);
                mesh.position.set(x, 2, z);
                scene.add(mesh);
                walls.push(new THREE.Box3().setFromObject(mesh));
            }

            addWall(0, -25, 50, 1);
            addWall(0, 25, 50, 1);
            addWall(-25, 0, 1, 50);
            addWall(25, 0, 1, 50);

            addWall(-10, -10, 15, 1);
            addWall(10, -5, 1, 15);
            addWall(-5, 10, 15, 1);
        }

        function checkCollision(position) {
            const playerBox = new THREE.Box3(
                new THREE.Vector3(position.x - 0.4, position.y - 1.5, position.z - 0.4),
                new THREE.Vector3(position.x + 0.4, position.y + 0.5, position.z + 0.4)
            );
            for (let wall of walls) {
                if (playerBox.intersectsBox(wall)) return true;
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                const oldPos = controls.getObject().position.clone();
                controls.moveRight(-velocity.x * delta);
                if (checkCollision(controls.getObject().position)) controls.getObject().position.x = oldPos.x;

                controls.moveForward(-velocity.z * delta);
                if (checkCollision(controls.getObject().position)) controls.getObject().position.z = oldPos.z;

                prevTime = time;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
